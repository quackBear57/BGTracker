name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name and tags
        id: meta
        run: |
          registry="${GITHUB_SERVER_URL#*://}"
          image="${registry}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          tags="-t ${image}:sha-${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags} -t ${image}:latest"
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags} -t ${image}:${GITHUB_REF_NAME#v}"
          fi
          {
            echo "registry=${registry}"
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build ${{ steps.meta.outputs.tags }} .

      - name: Log in to registry
        if: github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.registry }}" -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${{ steps.meta.outputs.image }}"
