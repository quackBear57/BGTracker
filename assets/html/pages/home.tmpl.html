{{define "title"}}Home{{end}}

{{define "main"}}
    <h2>Recently Added Games</h2>
    {{if .Games}}
    <table>
        <tr>
            <th>Title</th>
            <th>Added</th>
            <th>ID</th>
        </tr>
        {{range .Games}}
        <tr>
            <td><a href="/games/{{.ID}}">{{.Title}}</a></td>
            <td>{{.Added}}</td>
            <td>#{{.ID}}</td>
        </tr>
        {{end}}
    </table>
    {{else}}
        <p>There's nothing here yet!</p>
    {{end}}
{{end}}
