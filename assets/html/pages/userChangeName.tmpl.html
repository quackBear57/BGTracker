{{define "title"}}Change Name (User){{end}}

{{define "main"}}
<div class="game">
    <div class="metadata">
            <strong>{{.User.Name}}</strong>
            <span></span>
        </div>
        <div class="minorInfo">
            <codeSmall>Email:</codeSmall>
            <spanSmall>{{.User.Email}}</spanSmall>
        </div>
</div>
<form action="/user/account/change-name" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    {{range .Form.NonFieldErrors}}
        <div class="error">{{.}}</div>
    {{end}}
    <div>
        <label>New Name:</label>
        {{with .Form.FieldErrors.name}}
            <label class="error">{{.}}</label>
        {{end}}
        <input type="name" name="newName">
    </div>
    <div>
        <input type="submit" value="Change Name">
    </div>
</form>
{{end}}
