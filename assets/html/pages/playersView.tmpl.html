{{define "title"}}Home{{end}}

{{define "main"}}
    <h2>Recently Added Players</h2>
    {{if .Players}}
    <table>
        <tr>
            <th>Name</th>
            <th>ID</th>
        </tr>
        {{range .Players}}
        <tr>
            <td><a href="/players/{{.ID}}">{{.Name}}</a></td>
            <td>{{humanDate .Created}}</td>
            <td>#{{.ID}}</td>
        </tr>
        {{end}}
    </table>
    {{else}}
        <p>There's nothing here yet!</p>
    {{end}}
{{end}}
