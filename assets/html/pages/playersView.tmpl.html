{{define "title"}}Home{{end}}

{{define "main"}}
    <div class="mainHeader">
        <div><h2>Active Players</h2></div>
        {{if .IsAuthenticated}}
            <div><a href="/players/new">Add Player</a></div>
        {{end}}
    </div>
    {{if .Players}}
    <table>
        <tr>
            <th>Name</th>
            <th>Created</th>
            <th>ID</th>
        </tr>
        {{range .Players}}
        <tr>
            <td><a href="/players/{{.ID}}">{{.Name}}</a></td>
            <td>{{humanDate .Created}}</td>
            <td>#{{.ID}}</td>
        </tr>
        {{end}}
    </table>
    {{else}}
        <p>There's nothing here yet!</p>
    {{end}}
{{end}}
