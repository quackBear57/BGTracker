{{define "title"}}Add a New Game{{end}}

{{define "main"}}
<form aciton="/game/new" method="POST">
    <div>
        <label>Title:</label>
        <input type="text" name="title">
    </div>
    <div>
        <label>BoardGameGeek ID:</label>
        <input type="text" name="bgg_id">
    </div>
    <div>
        <label>Year Published:</label>
        <input type="number" name="year_pub" min="1500" max="3000" step="1" value="{{.CurrentYear}}">
    </div>
    <div>
        <label>Description:</label>
        <textarea name="description"></textarea>
    </div>
    <div>
        <label>Price:</label>
        <input type="number" name="price" min="0" max="9999" step="0.01">
    </div>
    <div>
        <label>Player Minimum:</label>
        <input type="number" name="player_min" min="0" max="999" step="1" value="0">
    </div>
    <div>
        <label>Player Maximum:</label>
        <input type="number" name="player_max" min="0" max="999" step="1" value="0">
    </div>
    <div>
        <label>Playtime Minimum (minutes):</label>
        <input type="number" name="playtime_min" min="0" max="999" step="1">
    </div>
    <div>
        <label>Playtime Maximum (minutes):</label>
        <input type="number" name="playtime_max" min="0" max="999" step="1">
    </div>
    <div>
        <label>Age Minimum (years):</label>
        <input type="number" name="age_min" min="0" max="199" step="1">
    </div>
    <div>
        <label>Has Scoring:</label>
        <input type="radio" name="scoring" id="scoring_true" value="1" checked="checked">
        <label for="scoring_true">Yes</label>
        <input type="radio" name="scoring" id="scoring_false" value="0">
        <label for="scoring_false">No</label>
    </div>
    <div>
        <label>State:</label>
        <input type="radio" name="state" id="owned" value="owned" checked="checked">
        <label for="owned">Owned</label>
        <input type="radio" name="state" id="wanted" value="wanted">
        <label for="wanted">Wanted</label>
    </div>
    <div>
        <input type="submit" value="Add Game">
    </div>
</form>
{{end}}
