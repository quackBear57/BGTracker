{{define "title"}}Game #{{.Game.ID}}{{end}}

{{define "main"}}
    <div class="game">
        <div class="metadata">
            <strong>{{.User.Name}}</strong>
        </div>
        <div class="minorInfo">
            <a class="spanLink" href="/user/account/change-password">Change Password</a>
            <a href="/user/account/change-name">Change Name</a>
        </div>
        <div class="minorInfo">
            <codeSmall>Email:</codeSmall>
            <spanSmall>{{.User.Email}}</spanSmall>
        </div>
        <div class="minorInfo">
            <codeSmall>Associated Player:</codeSmall>
            {{if ne .Player.Name ""}}
                <a class="spanLink" href="/players/{{.Player.ID}}">{{.Player.Name}}</a>
            {{else}}
                <spanSmall>None</spanSmall>
            {{end}}
        </div>
        <div class="minorInfo">
            <a href="/players/assign">Change Associated Player</a>
        </div>
        <div class="minorInfo">
            <codeSmall>Created:</codeSmall>
            <spanSmall>{{humanDate .User.Created}}</spanSmall>
        </div>
    </div>
{{end}}
