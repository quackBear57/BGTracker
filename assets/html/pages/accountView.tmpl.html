{{define "title"}}Game #{{.Game.ID}}{{end}}

{{define "main"}}
    {{with .User}}
    <div class="game">
        <div class="metadata">
            <strong>{{.Name}}</strong>
        </div>
        <div class="minorInfo">
            <codeSmall>Email:</codeSmall>
            <spanSmall>{{.Email}}</spanSmall>
        </div>
        <div class="minorInfo">
            <codeSmall>Created:</codeSmall>
            <spanSmall>{{humanDate .Created}}</spanSmall>
        </div>
        <div class="minorInfo">
            <a href="/user/account/change-password">Change Password</a>
        </div>
    </div>
    {{end}}
{{end}}
